name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to the VS Code Marketplace
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Package VSIX
        run: npm run package:vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple-html-viewer-release-vsix
          path: "*.vsix"

      - name: Publish to Marketplace
        if: ${{ github.event.inputs.publish == 'true' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --pat "$VSCE_PAT"
