name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag and GitHub Release version (for example v0.1.0)
        required: true
        default: 'v0.1.0'
        type: string
      publish:
        description: Publish to the VS Code Marketplace
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      publish_open_vsx:
        description: Publish to Open VSX
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_name: ${{ steps.metadata.outputs.name }}
      release_publisher: ${{ steps.metadata.outputs.publisher }}
      release_version: ${{ steps.metadata.outputs.version }}
      vsix_name: ${{ steps.metadata.outputs.vsix_name }}
      source_commit: ${{ steps.source.outputs.source_commit }}

    steps:
      - name: Checkout workflow source and tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require master workflow ref and select release source
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "Run this release workflow from master; current ref is $GITHUB_REF."
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            source_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
            source_ref="$source_commit"
            echo "Using the existing tag $RELEASE_TAG as the release source."
          else
            source_ref="$GITHUB_SHA"
            source_commit="$GITHUB_SHA"
            echo "The tag does not exist yet; using the workflow commit as the release source."
          fi
          if ! git merge-base --is-ancestor "$source_commit" "$GITHUB_SHA"; then
            echo "Release source must be part of the master workflow commit history."
            exit 1
          fi
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"

      - name: Checkout selected release source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.source_ref }}
          path: extension
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install root release tooling
        run: npm ci

      - name: Release tooling tests
        run: npm run test:release

      - name: Install selected source dependencies
        working-directory: extension
        run: npm ci

      - name: Validate release version and expose package metadata
        id: metadata
        working-directory: extension
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          publisher="$(node -p "require('./package.json').publisher")"
          expected_tag="v$version"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Release tag $RELEASE_TAG must match the selected source package version $expected_tag."
            exit 1
          fi
          {
            echo "version=$version"
            echo "name=$name"
            echo "publisher=$publisher"
            echo "vsix_name=$name-$version.vsix"
          } >> "$GITHUB_OUTPUT"

      - name: Lint selected source
        working-directory: extension
        run: npm run lint

      - name: Unit tests for selected source
        working-directory: extension
        run: npm run test

      - name: Source smoke tests
        working-directory: extension
        run: xvfb-run -a npm run test:smoke

      - name: Find and download existing GitHub Release VSIX
        id: existing_asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          VSIX_NAME: ${{ steps.metadata.outputs.vsix_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-vsix"
          error_file="$RUNNER_TEMP/release-view-error.txt"
          if response="$(gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>"$error_file")"; then
            release_exists=true
          else
            gh_status=$?
            response_status="$(printf '%s\n' "$response" | sed -n '1s/.* \([0-9][0-9][0-9]\) .*/\1/p')"
            if [[ "$response_status" == "404" ]]; then
              release_exists=false
            else
              cat "$error_file" >&2
              echo "Unable to inspect GitHub Release $RELEASE_TAG (HTTP ${response_status:-unknown})."
              exit "$gh_status"
            fi
          fi

          asset_exists=false
          if [[ "$release_exists" == "true" ]]; then
            existing_vsix_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '[.assets[].name | select(endswith(".vsix"))] | .[]' --repo "$GITHUB_REPOSITORY")"
            if [[ -n "$existing_vsix_assets" ]] && ! printf '%s\n' "$existing_vsix_assets" | grep -Fxq "$VSIX_NAME"; then
              echo "Release $RELEASE_TAG has a VSIX asset with a different filename; refusing to replace release package bytes."
              exit 1
            fi
            if printf '%s\n' "$existing_vsix_assets" | grep -Fxq "$VSIX_NAME"; then
              gh release download "$RELEASE_TAG" --pattern "$VSIX_NAME" --dir "$RUNNER_TEMP/release-vsix" --repo "$GITHUB_REPOSITORY"
              asset_exists=true
            fi
          fi
          echo "release_exists=$release_exists" >> "$GITHUB_OUTPUT"
          echo "asset_exists=$asset_exists" >> "$GITHUB_OUTPUT"

      - name: Build VSIX candidate when no release asset exists
        if: ${{ steps.existing_asset.outputs.asset_exists != 'true' }}
        working-directory: extension
        run: npm run package:vsix

      - name: Select VSIX for validation
        if: ${{ steps.existing_asset.outputs.asset_exists != 'true' }}
        env:
          VSIX_NAME: ${{ steps.metadata.outputs.vsix_name }}
        run: |
          set -euo pipefail
          candidate="extension/$VSIX_NAME"
          test -f "$candidate"
          cp "$candidate" "$RUNNER_TEMP/release-vsix/$VSIX_NAME"

      - name: Smoke test the exact GitHub Release VSIX
        working-directory: extension
        env:
          VSIX_NAME: ${{ steps.metadata.outputs.vsix_name }}
          RELEASE_NAME: ${{ steps.metadata.outputs.name }}
          RELEASE_PUBLISHER: ${{ steps.metadata.outputs.publisher }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          PACKAGE_JSON: ${{ runner.temp }}/release-package.json
        run: |
          set -euo pipefail
          release_vsix="$RUNNER_TEMP/release-vsix/$VSIX_NAME"
          test -f "$release_vsix"
          cp "$release_vsix" "$VSIX_NAME"
          unzip -p "$release_vsix" extension/package.json > "$RUNNER_TEMP/release-package.json"
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync(process.env.PACKAGE_JSON, "utf8"));
            for (const key of ["name", "publisher", "version"]) {
              const expected = process.env[`RELEASE_${key.toUpperCase()}`];
              if (pkg[key] !== expected) {
                throw new Error(`Downloaded VSIX ${key} ${pkg[key]} does not match selected source ${expected}.`);
              }
            }
          '
          xvfb-run -a npm run test:smoke:vsix:existing

      - name: Upload tested VSIX for registry jobs
        uses: actions/upload-artifact@v6
        with:
          name: simple-html-viewer-release-vsix
          path: ${{ format('{0}/release-vsix/{1}', runner.temp, steps.metadata.outputs.vsix_name) }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout workflow tooling
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download tested VSIX
        uses: actions/download-artifact@v6
        with:
          name: simple-html-viewer-release-vsix
          path: release-vsix

      - name: Validate remote tag and create it if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          set -euo pipefail
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          remote_tags="$(GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="$auth_header" git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          remote_tag_commit="$(printf '%s\n' "$remote_tags" | awk -v tag="refs/tags/$RELEASE_TAG" '$2 == tag "^{}" { peeled=$1 } $2 == tag { direct=$1 } END { print (peeled != "" ? peeled : direct) }')"
          if [[ -n "$remote_tag_commit" ]]; then
            if [[ "$remote_tag_commit" != "$SOURCE_COMMIT" ]]; then
              echo "Remote tag $RELEASE_TAG resolves to $remote_tag_commit, not selected source $SOURCE_COMMIT."
              exit 1
            fi
            echo "Remote tag $RELEASE_TAG points at the selected source."
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$SOURCE_COMMIT" >/dev/null
            echo "Created tag $RELEASE_TAG at $SOURCE_COMMIT."
          fi

      - name: Create release and upload tested VSIX if absent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          VSIX_NAME: ${{ needs.build.outputs.vsix_name }}
        run: |
          set -euo pipefail
          error_file="$RUNNER_TEMP/release-view-error.txt"
          if response="$(gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>"$error_file")"; then
            release_exists=true
          else
            gh_status=$?
            response_status="$(printf '%s\n' "$response" | sed -n '1s/.* \([0-9][0-9][0-9]\) .*/\1/p')"
            if [[ "$response_status" == "404" ]]; then
              release_exists=false
            else
              cat "$error_file" >&2
              echo "Unable to inspect GitHub Release $RELEASE_TAG (HTTP ${response_status:-unknown})."
              exit "$gh_status"
            fi
          fi

          if [[ "$release_exists" == "true" ]]; then
            existing_vsix_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '[.assets[].name | select(endswith(".vsix"))] | .[]' --repo "$GITHUB_REPOSITORY")"
            if [[ -n "$existing_vsix_assets" ]] && ! printf '%s\n' "$existing_vsix_assets" | grep -Fxq "$VSIX_NAME"; then
              echo "Release $RELEASE_TAG has a VSIX asset with a different filename; refusing to replace release package bytes."
              exit 1
            fi
            if printf '%s\n' "$existing_vsix_assets" | grep -Fxq "$VSIX_NAME"; then
              mkdir -p "$RUNNER_TEMP/existing-vsix"
              gh release download "$RELEASE_TAG" --pattern "$VSIX_NAME" --dir "$RUNNER_TEMP/existing-vsix" --repo "$GITHUB_REPOSITORY"
              validated_sha="$(sha256sum "release-vsix/$VSIX_NAME" | awk '{print $1}')"
              existing_sha="$(sha256sum "$RUNNER_TEMP/existing-vsix/$VSIX_NAME" | awk '{print $1}')"
              if [[ "$existing_sha" != "$validated_sha" ]]; then
                echo "Existing GitHub Release VSIX differs from the tested artifact; refusing to replace it."
                exit 1
              fi
              echo "Existing GitHub Release VSIX matches the tested artifact."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "Release $RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          fi

          gh release upload "$RELEASE_TAG" "release-vsix/$VSIX_NAME" --repo "$GITHUB_REPOSITORY"

  marketplace:
    if: ${{ github.ref == 'refs/heads/master' && inputs.publish == 'true' }}
    needs:
      - build
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout workflow tooling
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install root release tooling
        run: npm ci

      - name: Download tested VSIX
        uses: actions/download-artifact@v6
        with:
          name: simple-html-viewer-release-vsix
          path: release-vsix

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          RELEASE_PUBLISHER: ${{ needs.build.outputs.release_publisher }}
          RELEASE_NAME: ${{ needs.build.outputs.release_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
          VSIX_NAME: ${{ needs.build.outputs.vsix_name }}
        run: node .github/scripts/publish-registry.js marketplace "release-vsix/$VSIX_NAME"

  open_vsx:
    if: ${{ github.ref == 'refs/heads/master' && inputs.publish_open_vsx == 'true' }}
    needs:
      - build
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout workflow tooling
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install root release tooling
        run: npm ci

      - name: Download tested VSIX
        uses: actions/download-artifact@v6
        with:
          name: simple-html-viewer-release-vsix
          path: release-vsix

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          RELEASE_PUBLISHER: ${{ needs.build.outputs.release_publisher }}
          RELEASE_NAME: ${{ needs.build.outputs.release_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
          VSIX_NAME: ${{ needs.build.outputs.vsix_name }}
        run: node .github/scripts/publish-registry.js openvsx "release-vsix/$VSIX_NAME"

  summary:
    if: ${{ always() }}
    needs:
      - build
      - release
      - marketplace
      - open_vsx
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Report release result
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          MARKETPLACE_RESULT: ${{ needs.marketplace.result }}
          OPEN_VSX_RESULT: ${{ needs.open_vsx.result }}
          PUBLISH_MARKETPLACE: ${{ inputs.publish }}
          PUBLISH_OPEN_VSX: ${{ inputs.publish_open_vsx }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          {
            echo "## Release $RELEASE_TAG"
            echo ""
            echo "- Build and VSIX validation: $BUILD_RESULT"
            echo "- Git tag and GitHub Release: $RELEASE_RESULT"
            if [[ "$PUBLISH_MARKETPLACE" == "true" ]]; then
              echo "- VS Code Marketplace: $MARKETPLACE_RESULT"
            else
              echo "- VS Code Marketplace: not selected"
            fi
            if [[ "$PUBLISH_OPEN_VSX" == "true" ]]; then
              echo "- Open VSX: $OPEN_VSX_RESULT"
            else
              echo "- Open VSX: not selected"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          failed=false
          [[ "$BUILD_RESULT" == "success" ]] || failed=true
          [[ "$RELEASE_RESULT" == "success" ]] || failed=true
          if [[ "$PUBLISH_MARKETPLACE" == "true" && "$MARKETPLACE_RESULT" != "success" ]]; then
            failed=true
          fi
          if [[ "$PUBLISH_OPEN_VSX" == "true" && "$OPEN_VSX_RESULT" != "success" ]]; then
            failed=true
          fi
          if [[ "$failed" == "true" ]]; then
            echo "The release build or a selected registry publication failed."
            exit 1
          fi
