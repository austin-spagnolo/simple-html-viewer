name: Release

env:
  MARKETPLACE_PUBLISHED_MARKER: '<!-- marketplace-published -->'

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag and GitHub Release version (for example v0.0.2)
        required: true
        default: 'v0.0.2'
        type: string
      publish:
        description: Publish to the VS Code Marketplace
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release tag
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          if [ "${{ github.event.inputs.tag }}" != "$expected_tag" ]; then
            echo "Release tag ${{ github.event.inputs.tag }} must match package.json version $expected_tag."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Smoke tests
        run: xvfb-run -a npm run test:smoke

      - name: Package VSIX
        run: npm run package:vsix

      - name: Packaged VSIX smoke tests
        run: xvfb-run -a npm run test:smoke:vsix:existing

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v6
        with:
          name: simple-html-viewer-release-vsix
          path: '*.vsix'

      - name: Create Git tag if missing
        run: |
          if git rev-parse "${{ github.event.inputs.tag }}" >/dev/null 2>&1; then
            tag_sha="$(git rev-list -n 1 "${{ github.event.inputs.tag }}")"
            head_sha="$(git rev-parse HEAD)"
            if [ "$tag_sha" != "$head_sha" ]; then
              echo "Tag ${{ github.event.inputs.tag }} points at $tag_sha, not current HEAD $head_sha."
              exit 1
            fi
            echo "Tag already exists locally and points at HEAD."
          else
            git tag "${{ github.event.inputs.tag }}"
          fi

      - name: Push Git tag if missing on origin
        run: |
          remote_tag_sha="$(git ls-remote --tags origin "refs/tags/${{ github.event.inputs.tag }}" | awk '{print $1}')"
          head_sha="$(git rev-parse HEAD)"
          if [ -n "$remote_tag_sha" ]; then
            if [ "$remote_tag_sha" != "$head_sha" ]; then
              echo "Remote tag ${{ github.event.inputs.tag }} points at $remote_tag_sha, not current HEAD $head_sha."
              exit 1
            fi
            echo "Tag already exists on origin and points at HEAD."
          else
            git push origin "${{ github.event.inputs.tag }}"
          fi

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.event.inputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1 && exists=true || exists=false
          if [ "$exists" = true ]; then
            gh release upload "${{ github.event.inputs.tag }}" ./*.vsix --clobber --repo "${{ github.repository }}"
          else
            gh release create "${{ github.event.inputs.tag }}" ./*.vsix --title "${{ github.event.inputs.tag }}" --notes "Release ${{ github.event.inputs.tag }}" --repo "${{ github.repository }}"
          fi

      - name: Block duplicate Marketplace publish
        if: ${{ github.event.inputs.publish == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="$(gh release view "${{ github.event.inputs.tag }}" --json body --jq '.body // ""' --repo "${{ github.repository }}")"
          if printf '%s' "$body" | grep -q "${MARKETPLACE_PUBLISHED_MARKER}"; then
            echo "Marketplace publish has already completed for tag ${{ github.event.inputs.tag }}."
            exit 1
          fi

      - name: Publish to Marketplace
        if: ${{ github.event.inputs.publish == 'true' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --pat "$VSCE_PAT" --githubBranch master

      - name: Mark GitHub Release as Marketplace published
        if: ${{ github.event.inputs.publish == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="$(gh release view "${{ github.event.inputs.tag }}" --json body --jq '.body // ""' --repo "${{ github.repository }}")"
          notes_file="$(mktemp)"
          printf '%s\n' "$body" > "$notes_file"
          printf '\n%s\n%s\n' "${MARKETPLACE_PUBLISHED_MARKER}" "Marketplace publish completed." >> "$notes_file"
          gh release edit "${{ github.event.inputs.tag }}" --notes-file "$notes_file" --repo "${{ github.repository }}"
